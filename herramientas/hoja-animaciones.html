<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Hoja de animaciones · Furia Mortal</title>
  <style>body { margin: 0; background: #20242c; }</style>
</head>
<body>
  <script type="importmap">
    { "imports": { "three": "../js/vendor/three/three.module.min.js", "three/addons/": "../js/vendor/three/addons/" } }
  </script>
  <script type="module">
    // Herramienta de desarrollo: dibuja cada animación de un GLB en varios instantes, en una cuadrícula.
    // hoja({ modelo, clips: [...], cols: 8, angulo: 70 }) -> canvas (y lo guarda vía el puente si se pasa 'guardar')
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const CW = 150, CH = 190;
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
    renderer.setSize(CW, CH);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight('#ffffff', '#404050', 2.4));
    const sun = new THREE.DirectionalLight('#ffffff', 2);
    sun.position.set(2, 4, 3);
    scene.add(sun);
    const cam = new THREE.OrthographicCamera(-1.05, 1.05, 1.45, -1.2, 0.1, 20);

    window.hoja = async ({ modelo, clips, cols = 8, angulo = 70, guardar }) => {
      const g = await new GLTFLoader().loadAsync(modelo);
      const m = g.scene;
      scene.add(m);
      const mixer = new THREE.AnimationMixer(m);
      const lista = clips || g.animations.map(a => a.name);
      const out = document.createElement('canvas');
      out.width = CW * cols; out.height = CH * lista.length;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#20242c'; ctx.fillRect(0, 0, out.width, out.height);
      ctx.font = '12px sans-serif';
      const r = THREE.MathUtils.degToRad(angulo);
      cam.position.set(Math.sin(r) * 6, 0.9, Math.cos(r) * 6);
      cam.lookAt(0, 0.9, 0);
      lista.forEach((nombre, fila) => {
        const clip = g.animations.find(a => a.name === nombre);
        mixer.stopAllAction();
        const act = mixer.clipAction(clip);
        act.play();
        for (let c = 0; c < cols; c++) {
          const t = clip.duration * c / (cols - 1);
          act.time = Math.min(t, clip.duration - 0.001);
          mixer.update(0);
          renderer.render(scene, cam);
          ctx.drawImage(renderer.domElement, c * CW, fila * CH);
          ctx.fillStyle = '#ffd060';
          ctx.fillText((c === 0 ? nombre + ' ' : '') + t.toFixed(2) + 's', c * CW + 4, fila * CH + 14);
        }
      });
      scene.remove(m);
      document.body.appendChild(out);
      if (guardar) await fetch('http://127.0.0.1:8099/' + guardar, { method: 'POST', body: out.toDataURL('image/png') });
      return lista.length;
    };
    window.listo = true;
  </script>
</body>
</html>
